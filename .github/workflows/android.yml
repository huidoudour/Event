name: Android CI

on:
  push:
    branches: [ "master" , "compose-ui" ]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 先行检查：commit 是否已打 tag → 已打则跳过构建（避免与 Release/Pre-release 重复）
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
    - uses: actions/checkout@v7
      with:
        # 默认浅克隆不拉取 tags, 会导致 git tag --points-at 永远为空
        fetch-tags: true
    - id: check
      run: |
        if [ -n "$(git tag --points-at HEAD)" ]; then
          echo "should-run=false" >> "$GITHUB_OUTPUT"
          echo "Commit is tagged, skipping CI build"
        else
          echo "should-run=true" >> "$GITHUB_OUTPUT"
        fi

  build-debug:
    needs: check-tag
    if: needs.check-tag.outputs.should-run == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Get short commit hash
      id: short_hash
      run: echo "hash=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create debug keystore file
      run: |
        echo "${{ secrets.DEBUG_STORE }}" | base64 -d > debug_sign_key
        ls -lh debug_sign_key
        file debug_sign_key
    
    - name: Build Debug APK with signing
      run: |
        ./gradlew assembleDebug \
          -Pandroid.injected.signing.store.file=$(pwd)/debug_sign_key \
          -Pandroid.injected.signing.store.password="${{ secrets.DEBUG_PASSD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.DEBUG_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.DEBUG_PASSD }}" \
          --stacktrace
    
    - name: Upload Debug APK as artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-debug-${{ steps.short_hash.outputs.hash }}
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    
    - name: Clean up debug keystore
      if: always()
      run: rm -f debug_sign_key

  build-release:
    needs: check-tag
    if: needs.check-tag.outputs.should-run == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Get short commit hash
      id: short_hash
      run: echo "hash=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create release keystore file
      run: |
        echo "${{ secrets.SIGN_KEY_STORE_B64 }}" | base64 -d > sign_key
        ls -lh sign_key
        file sign_key
    
    - name: Build Release APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/sign_key \
          -Pandroid.injected.signing.store.password="${{ secrets.SIGN_KEY_STORE_PASSWD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.SIGN_KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.SIGN_KEY_ALIAS_PASSWD }}" \
          --stacktrace
    
    - name: Upload Release APK as artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-release-${{ steps.short_hash.outputs.hash }}
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
    
    - name: Clean up keystore
      if: always()
      run: rm -f sign_key
