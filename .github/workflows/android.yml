name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Get short commit hash
      id: short_hash
      run: echo "hash=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create debug keystore file
      run: |
        echo "${{ secrets.DEBUG_STORE }}" | base64 -d > debug_sign_key
        ls -lh debug_sign_key
        file debug_sign_key
    
    - name: Build Debug APK with signing
      run: |
        ./gradlew assembleDebug \
          -Pandroid.injected.signing.store.file=$(pwd)/debug_sign_key \
          -Pandroid.injected.signing.store.password="${{ secrets.DEBUG_PASSD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.DEBUG_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.DEBUG_PASSD }}" \
          --stacktrace
    
    - name: Upload Debug APK as artifact
      uses: actions/upload-artifact@v5
      with:
        name: app-debug-${{ steps.short_hash.outputs.hash }}
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    
    - name: Clean up debug keystore
      if: always()
      run: rm -f debug_sign_key

  build-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Get short commit hash
      id: short_hash
      run: echo "hash=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create release keystore file
      run: |
        echo "${{ secrets.SIGN_KEY_STORE_B64 }}" | base64 -d > sign_key
        ls -lh sign_key
        file sign_key
    
    - name: Build Release APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/sign_key \
          -Pandroid.injected.signing.store.password="${{ secrets.SIGN_KEY_STORE_PASSWD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.SIGN_KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.SIGN_KEY_ALIAS_PASSWD }}" \
          --stacktrace
    
    - name: Upload Release APK as artifact
      uses: actions/upload-artifact@v5
      with:
        name: app-release-${{ steps.short_hash.outputs.hash }}
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
    
    - name: Clean up keystore
      if: always()
      run: rm -f sign_key
