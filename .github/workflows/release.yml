name: Release

on:
  push:
    tags:
      - 'v*'
      # 排除预发布标签；预发布请使用 pre-release.yml 触发
      - '!v*-beta*'
      - '!v*-rc*'
      - '!v*-alpha*'
      - '!v*-pre*'

env:
  SIGN_KEYSTORE_PATH: ${{ github.workspace }}/sign_key
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: |
        echo "$SIGN_KEY_STORE_B64" | base64 -d > ${{ env.SIGN_KEYSTORE_PATH }}
      env:
        SIGN_KEY_STORE_B64: ${{ secrets.SIGN_KEY_STORE_B64 }}

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build Signed Release APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file="${{ env.SIGN_KEYSTORE_PATH }}" \
          -Pandroid.injected.signing.store.password="${{ secrets.SIGN_KEY_STORE_PASSWD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.SIGN_KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.SIGN_KEY_ALIAS_PASSWD }}"

    - name: Rename APK with version
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Event-${{ steps.get_version.outputs.VERSION }}.apk

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v5
      if: success()
      with:
        name: app-signed-release
        path: app/build/outputs/apk/release/Event-${{ steps.get_version.outputs.VERSION }}.apk
        retention-days: 30

    - name: Get git commit messages
      id: git_commits
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          COMMITS=$(git log --oneline --no-merges $PREV_TAG..HEAD)
        else
          COMMITS=$(git log --oneline --no-merges)
        fi
        FORMATTED=$(echo "$COMMITS" | sed 's/^/- /')
        echo "commits<<EOF" >> $GITHUB_OUTPUT
        echo "$FORMATTED" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2.2.2
      if: success()
      with:
        files: app/build/outputs/apk/release/Event-${{ steps.get_version.outputs.VERSION }}.apk
        name: Release ${{ steps.get_version.outputs.VERSION }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          ## 更新内容
          ${{ steps.git_commits.outputs.commits }}

          ### 安装说明
          下载并安装 APK 文件即可使用。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup Keystore
      if: always()
      run: rm -f ${{ env.SIGN_KEYSTORE_PATH }}
